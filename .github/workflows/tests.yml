name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    services:
      # Same versions as production: Neon PostgreSQL 17.11, Redis 8.0.5 on the server.
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crm_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d crm_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.0.5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Throwaway service containers; the tests only run against a local *_test database.
      CHAT_PG_TEST_URL: postgresql://ci:ci@127.0.0.1:5432/crm_ci_test
      CHAT_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu's own Python 3.14 package, the same build the production server runs.
      - name: Set up Python
        run: |
          /usr/bin/python3.14 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # A patch-level Python difference only warns: a runner image update should not block every merge.
      - name: Check versions
        env:
          PGPASSWORD: ci
        run: |
          fail=0
          want_py=$(cat ../.python-version)
          have_py=$(python -c 'import platform; print(platform.python_version())')
          if [ "$have_py" = "$want_py" ]; then echo "Python $have_py"
          elif [ "${have_py%.*}" = "${want_py%.*}" ]; then echo "::warning::Python is $have_py on this runner, production runs $want_py"
          else echo "::error::Python is $have_py, expected $want_py"; fail=1; fi
          have_pg=$(psql -h 127.0.0.1 -U ci -d crm_ci_test -tAc 'SHOW server_version' | cut -d' ' -f1)
          if [ "$have_pg" = "17.11" ]; then echo "PostgreSQL $have_pg"; else echo "::error::PostgreSQL is $have_pg, expected 17.11"; fail=1; fi
          have_redis=$(python -c "import os, redis; print(redis.Redis.from_url(os.environ['CHAT_REDIS_TEST_URL']).info()['redis_version'])")
          if [ "$have_redis" = "8.0.5" ]; then echo "Redis $have_redis"; else echo "::error::Redis is $have_redis, expected 8.0.5"; fail=1; fi
          exit $fail
      - name: Migrate the test database
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/crm_ci_test
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -rsx
      - name: Run lead tests on PostgreSQL
        env:
          PGPASSWORD: ci
          CRM_PG_TEST_URL: postgresql://ci:ci@127.0.0.1:5432/crm_ci_leads_test
        run: |
          psql -h 127.0.0.1 -U ci -d crm_ci_test -c "CREATE DATABASE crm_ci_leads_test"
          python -m pytest tests/sales/test_lead_access.py tests/sales/test_lead_claim.py tests/sales/test_lead_data.py tests/sales/test_lead_screens.py -q -p no:cacheprovider -rsx

  frontend:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check versions
        run: |
          want=$(cat ../.nvmrc); have=$(node -p 'process.versions.node')
          if [ "$have" != "$want" ]; then echo "::error::Node is $have, expected $want"; exit 1; fi
          echo "Node $have, npm $(npm -v)"
      # The repo root is an npm workspace whose lockfile only lists Windows binaries;
      # --workspaces=false makes npm use frontend/package-lock.json (all platforms).
      - name: Install dependencies
        run: npm ci --workspaces=false
      - name: Unit tests
        run: |
          status=0
          for script in test:paths test:landing test:brand test:store test:i18n test:chat test:auth; do
            echo "::group::$script"
            npm run --workspaces=false "$script" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Build
        run: npm run --workspaces=false build
